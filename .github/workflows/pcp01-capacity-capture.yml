            --start-index 15 --end-index 19
      - name: Persist segment
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_ROOT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: capture PCP-01 Capacity events 15-19"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  segment_20_23:
    needs: segment_15_19
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
