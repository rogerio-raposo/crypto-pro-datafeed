          git push origin "HEAD:${GITHUB_REF_NAME}"

  turnover_at_t0:
    needs: segment_20_23
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync selected branch
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"
      - name: Wait until T0
        run: |
          python - <<'PY'
          import json, time
          from datetime import datetime, timezone
          from pathlib import Path

          activation = json.loads(Path("data/experimental/pcp-01/capture/activation.json").read_text())
          t0 = datetime.fromisoformat(activation["t0_utc"].replace("Z", "+00:00"))
          now = datetime.now(timezone.utc)
          if now < t0:
              time.sleep((t0 - now).total_seconds() + 10)
          PY
      - name: Capture exact seven-day turnover
        run: |
          python src/experimental/pcp01/pcp01_turnover_at_t0.py \
            --activation "$ACTIVATION" --output-root "$OUTPUT_ROOT"
      - name: Persist turnover
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_ROOT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: capture PCP-01 turnover at T0"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
