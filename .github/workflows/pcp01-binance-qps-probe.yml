name: PCP-01 Binance QPS Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pcp01-binance-qps-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile experimental probe
        run: python -m py_compile src/experimental/pcp01/binance_qps_probe.py

      - name: Run Binance QPS probe
        run: |
          mkdir -p data/experimental/pcp-01/dry-run
          python src/experimental/pcp01/binance_qps_probe.py \
            --symbol BTCUSDT \
            --depth-limit 1000 \
            --output data/experimental/pcp-01/dry-run/binance-BTCUSDT.json

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcp01-binance-qps-probe-BTCUSDT
          path: data/experimental/pcp-01/dry-run/binance-BTCUSDT.json
          if-no-files-found: error
