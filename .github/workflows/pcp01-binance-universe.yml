name: PCP-01 Binance Supported Market Universe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pcp01-binance-universe.yml"

permissions:
  contents: write

jobs:
  universe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile universe builder
        run: python -m py_compile src/experimental/pcp01/binance_universe_snapshot.py

      - name: Build provisional supported market universe
        run: python src/experimental/pcp01/binance_universe_snapshot.py

      - name: Persist experimental universe snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/experimental/pcp-01/universe/binance-supported-market-universe.json
          if git diff --cached --quiet; then
            echo "No universe snapshot change to commit."
          else
            git commit -m "data: capture PCP-01 Binance universe snapshot"
            git push
          fi

      - name: Upload universe artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcp01-binance-supported-market-universe
          path: data/experimental/pcp-01/universe/binance-supported-market-universe.json
          if-no-files-found: error
