name: PCP-01 Capacity Two-Cycle Dry Run

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pcp01-capacity-dry-run.yml"

permissions:
  contents: write

concurrency:
  group: pcp01-capacity-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Check whether two-cycle dry-run already passed
        id: readiness
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path("data/experimental/pcp-01/dry-run/capacity-status.json")
          passed = False
          if p.exists():
              try:
                  passed = json.loads(p.read_text()).get("two_cycle_status") == "PASS"
              except Exception:
                  passed = False

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"skip={'true' if passed else 'false'}\n")

          print("already_qualified=", passed)
          PY

      - name: Compile collector
        if: steps.readiness.outputs.skip != 'true'
        run: |
          python -m py_compile src/experimental/pcp01/binance_qps_probe.py
          python -m py_compile src/experimental/pcp01/pcp01_capacity_dry_run.py

      - name: Run controlled cycle A
        if: steps.readiness.outputs.skip != 'true'
        run: |
          mkdir -p data/experimental/pcp-01/dry-run
          python src/experimental/pcp01/pcp01_capacity_dry_run.py \
            --cycle-id "gh-${{ github.run_id }}-A" \
            --output "data/experimental/pcp-01/dry-run/capacity-cycle-${{ github.run_id }}-A.json" \
            --status-file "data/experimental/pcp-01/dry-run/capacity-status.json"

      - name: Wait one hour before cycle B
        if: steps.readiness.outputs.skip != 'true'
        run: |
          echo "Cycle A completed. Waiting 3600 seconds before cycle B."
          sleep 3600

      - name: Run controlled cycle B
        if: steps.readiness.outputs.skip != 'true'
        run: |
          python src/experimental/pcp01/pcp01_capacity_dry_run.py \
            --cycle-id "gh-${{ github.run_id }}-B" \
            --output "data/experimental/pcp-01/dry-run/capacity-cycle-${{ github.run_id }}-B.json" \
            --status-file "data/experimental/pcp-01/dry-run/capacity-status.json"

      - name: Verify controlled two-cycle qualification
        if: steps.readiness.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          run_id = "${{ github.run_id }}"
          expected = [f"gh-{run_id}-A", f"gh-{run_id}-B"]
          p = Path("data/experimental/pcp-01/dry-run/capacity-status.json")
          status = json.loads(p.read_text())

          if status.get("two_cycle_status") != "PASS":
              raise SystemExit(
                  f"two_cycle_status={status.get('two_cycle_status')}; expected PASS"
              )

          if status.get("qualified_cycle_ids") != expected:
              raise SystemExit(
                  "Qualified cycles do not match controlled pair: "
                  f"{status.get('qualified_cycle_ids')} != {expected}"
              )

          print("Controlled two-cycle qualification PASS:", expected)
          PY

      - name: Upload controlled dry-run artifacts
        if: steps.readiness.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pcp01-capacity-controlled-pair-${{ github.run_id }}
          path: |
            data/experimental/pcp-01/dry-run/capacity-cycle-${{ github.run_id }}-A.json
            data/experimental/pcp-01/dry-run/capacity-cycle-${{ github.run_id }}-B.json
          if-no-files-found: error

      - name: Persist lightweight dry-run status
        if: steps.readiness.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/experimental/pcp-01/dry-run/capacity-status.json
          if git diff --cached --quiet; then
            echo "No dry-run status change to commit."
          else
            git commit -m "data: qualify PCP-01 controlled two-cycle dry-run"
            git pull --rebase origin main
            git push
          fi
